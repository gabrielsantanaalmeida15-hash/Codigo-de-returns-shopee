services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: fluxo
      POSTGRES_USER: fluxo
      POSTGRES_PASSWORD: fluxo
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./db/schema.sql:/docker-entrypoint-initdb.d/001-schema.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U fluxo -d fluxo"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  postgres_data:
